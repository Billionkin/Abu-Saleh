<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Challenge App</title>
<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:15px;
width:300px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

button{
background:#22c55e;
border:none;
padding:12px 20px;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#16a34a;
}

.progress{
margin-top:20px;
font-size:20px;
}

</style>
</head>

<body>

<h1>30 Day Challenge</h1>

<div class="card">

<h2>Reading Challenge</h2>

<p>Complete reading every day</p>

<button onclick="checkin()">Complete Today</button>

<div class="progress">
Days Completed: <span id="days">0</span>
</div>

</div>

<script>

let days = localStorage.getItem("days") || 0
document.getElementById("days").innerText = days

function checkin(){

days++

localStorage.setItem("days",days)

document.getElementById("days").innerText = days

if(days==30){
alert("Challenge Completed 🎉")
}

}

</script>

</body>
</html>
