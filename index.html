<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChallengeUp</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#1e293b;
padding:30px;
border-radius:15px;
text-align:center;
width:300px;
}

button{
margin-top:20px;
padding:10px 20px;
border:none;
background:#22c55e;
color:white;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.progress{
margin-top:20px;
font-size:20px;
}

</style>

</head>

<body>

<div class="card">

<h2>30 Day Challenge</h2>

<p>Read every day</p>

<button onclick="done()">Complete Today</button>

<div class="progress">
Days: <span id="days">0</span>/30
</div>

</div>

<script>

let days = localStorage.getItem("days") || 0
document.getElementById("days").innerText = days

function done(){

if(days<30){
days++
localStorage.setItem("days",days)
document.getElementById("days").innerText=days
}

}

</script>

</body>
</html>
